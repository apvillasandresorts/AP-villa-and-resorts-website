# Founder OS → CRM → Blog engine: when the owner accepts a topic, this starts the blog pipeline.
# Portal and GitHub never talk directly, so no GitHub token is stored in Apps Script.
name: Blog queue

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: blog-queue
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start the blog pipeline if a topic was accepted
        env:
          FOUNDER_OS_KEY: ${{ secrets.FOUNDER_OS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          waiting=$(node scripts/push-market.mjs --seo-peek | sed -n 's/^waiting=//p')
          echo "Accepted topics waiting: ${waiting:-0}"
          [ "${waiting:-0}" -gt 0 ] || exit 0
          busy=$(gh run list --workflow blog.yml --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')
          [ "$busy" -eq 0 ] || { echo "The blog pipeline is already running."; exit 0; }
          gh workflow run blog.yml
